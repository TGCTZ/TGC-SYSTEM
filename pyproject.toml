# ============================================================
# Tool configuration for TGC-SYSTEM
#
# This project is a Django application, not a distributed package,
# so there is no [build-system] or [project] table — dependencies
# live in requirements/. This file is the single control panel for
# our dev tools: Ruff, pytest, coverage, and mypy.
#
# The Ruff rules below enforce the "(Ruff)" conventions in
# docs/engineering/conventions.md so they are checked automatically, not by hand.
# ============================================================


# ------------------------------------------------------------
# Ruff — linter + formatter + import sorter (one tool)
# ------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"          # match the project's Python version
extend-exclude = ["migrations"]   # generated code — don't lint it

[tool.ruff.lint]
# Rule families we enable. Each maps to conventions in docs/engineering/conventions.md.
select = [
    "E",    # pycodestyle errors        — PEP 8
    "W",    # pycodestyle warnings
    "F",    # pyflakes                  — unused imports, undefined names
    "I",    # isort                     — import ordering (§20)
    "N",    # pep8-naming               — naming conventions (§4)
    "UP",   # pyupgrade                 — modern syntax
    "B",    # flake8-bugbear            — likely bugs (incl. bare except)
    "DJ",   # flake8-django             — Django-specific pitfalls
    "S",    # flake8-bandit             — security issues (§14)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib        — pathlib over os.path (§20)
    "RUF",  # Ruff-specific rules
]

# F403/F405 (wildcard imports) are on via "F" and stay errors — enforces
# the "no wildcard imports" rule in §9 and §20.

ignore = [
    "S101",    # assert used — fine in tests (also handled per-file below)
    "RUF012",  # Django Meta/ModelPanel class attrs (fields, ordering) aren't ClassVar
    "DJ012",   # Django Meta field-ordering convention differs from Ruff's preference
]

[tool.ruff.lint.per-file-ignores]
# Settings files legitimately re-export and use wildcard/long lines.
"config/settings/*" = ["F403", "F405", "E501"]
# Tests may use asserts and hard-coded test data freely.
"**/tests/*" = ["S101", "S105", "S106"]
"**/factories.py" = ["S311"]   # non-crypto random is fine for fake data

[tool.ruff.lint.isort]
# Group local apps separately so import order reads:
# stdlib → third-party → django → first-party → local
known-first-party = ["config", "apps"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "django",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.lint.flake8-bugbear]
# Allow Django's callable defaults / DRF patterns without false positives.
extend-immutable-calls = ["django.utils.timezone.now"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true      # format code blocks inside docstrings


# ------------------------------------------------------------
# pytest — test runner (with pytest-django)
# ------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
# --strict-markers: typo'd markers fail instead of silently passing
# --reuse-db: keep the test DB between runs for speed
addopts = "--strict-markers --reuse-db"


# ------------------------------------------------------------
# coverage — test coverage measurement
# ------------------------------------------------------------
[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
    "*/admin.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true


# ------------------------------------------------------------
# mypy — optional static type checking (§20)
# ------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true     # third-party libs without stubs
exclude = ['migrations/']
