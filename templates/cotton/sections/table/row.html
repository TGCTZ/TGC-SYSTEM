<!-- Table row. Put your data cells (<td>) in the slot; a trailing actions cell is
     appended automatically. Pass href to make the whole row clickable, and
     actions=[...] (see apps.core.row_actions) for the per-row action controls. Any
     other attributes (e.g. x-show, data-*) pass through to the <tr>. -->
<c-vars href="" actions="" />
<tr {% if href %}data-href="{{ href }}" {% endif %}class="transition-colors hover:bg-blue-100/70" {{ attrs }}>
  {{ slot }}
  <td class="px-6 py-3 text-right">
    <c-atoms.ui.row-actions :actions="actions" />
  </td>
</tr>
