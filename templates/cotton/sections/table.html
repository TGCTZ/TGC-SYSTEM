<!-- Table: headers=list, count (optional; 0 shows the empty state), empty text,
     loading=bool. Rows go in the slot as table.row components. A trailing actions
     column header is added by default; pass actions="false" to omit it.
     Pass count as a string ("{{ items|length }}") so a zero survives cotton binding. -->
<c-vars headers="" count="" empty="No data available" loading="false" actions="true" />
<div class="w-full overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
  {% if loading == 'true' or loading == True %}
    <div class="flex items-center justify-center gap-2 py-10 text-gray-400">
      <c-atoms.ui.spinner /> Loading…
    </div>
  {% elif count == 0 or count == '0' %}
    <div class="flex flex-col items-center gap-2 py-12 text-gray-400">
      <c-atoms.ui.icon name="lucide:inbox" size="lg" />
      <p class="text-sm">{{ empty }}</p>
    </div>
  {% else %}
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        {% if headers %}
          <thead class="bg-gray-50/80">
            <tr>
              {% for h in headers %}
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">{{ h }}</th>
              {% endfor %}
              {% if actions == 'true' or actions == True %}
                <th class="px-6 py-3"><span class="sr-only">Actions</span></th>
              {% endif %}
            </tr>
          </thead>
        {% endif %}
        <tbody class="divide-y divide-gray-100 text-sm text-gray-700">{{ slot }}</tbody>
      </table>
    </div>
  {% endif %}
</div>
