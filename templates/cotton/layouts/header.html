<!-- Header: top bar with page title, notifications, and account menu. -->
<c-vars title="TGC System" />
<header class="flex h-16 items-center justify-between border-b border-gray-200 bg-white px-6">
  <div class="flex items-center gap-3">
    <button class="text-gray-500 md:hidden"><c-atoms.ui.icon name="lucide:menu" /></button>
    <h1 class="text-base font-semibold text-gray-900">{{ title }}</h1>
  </div>
  <div class="flex items-center gap-4">
    <button class="text-gray-500 hover:text-gray-700"><c-atoms.ui.icon name="lucide:bell" /></button>
    <c-atoms.ui.dropdown label="{{ request.user.get_username|default:'Account' }}" align="right">
      <a href="#" class="block px-3 py-2 text-sm text-gray-700 hover:bg-gray-50">Profile</a>
      <a href="#" class="block px-3 py-2 text-sm text-gray-700 hover:bg-gray-50">Logout</a>
    </c-atoms.ui.dropdown>
  </div>
</header>
