<!-- Header: two rows. Row 1 = page title (left) + notifications (right).
     Row 2 = back button (left) + search (middle, when the page sets one) + breadcrumb (right). -->
<c-vars title="" search_placeholder="" />
<header class="border-b bg-card px-6">
  <div class="flex h-14 items-center justify-between">
    <div class="flex items-center gap-3">
      <button class="text-muted-foreground md:hidden"><c-atoms.ui.icon name="lucide:menu" /></button>
      <h1 class="text-lg font-semibold text-foreground">{{ title|default:SITE_NAME }}</h1>
    </div>
    <button class="text-muted-foreground transition-colors hover:text-foreground" aria-label="Notifications">
      <c-atoms.ui.icon name="lucide:bell" />
    </button>
  </div>

  <div class="flex h-12 items-center gap-4 border-t">
    <div class="shrink-0">
      <button type="button" x-data="{ show: window.history.length > 1 }" x-show="show" x-cloak
        @click="history.back()" aria-label="Go back"
        class="inline-flex items-center gap-1.5 rounded-md border border-input bg-background px-2.5 py-1.5 text-sm font-medium shadow-xs transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none">
        <c-atoms.ui.icon name="lucide:arrow-left" size="sm" /> Back
      </button>
    </div>

    <div class="flex flex-1 justify-center">
      {% if search_placeholder %}
        <c-atoms.ui.search placeholder="{{ search_placeholder }}" value="{{ request.GET.q }}" />
      {% endif %}
    </div>

    <nav class="hidden shrink-0 items-center gap-1.5 text-xs text-muted-foreground sm:flex" aria-label="Breadcrumb">
      {% for crumb in breadcrumbs %}
        <a href="{{ crumb.url }}" class="transition-colors hover:text-foreground">{{ crumb.label }}</a>
        <c-atoms.ui.icon name="lucide:chevron-right" size="sm" />
      {% endfor %}
      <span class="font-medium text-foreground">{{ title|default:SITE_NAME }}</span>
    </nav>
  </div>
</header>
