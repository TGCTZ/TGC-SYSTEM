<!-- Header: two rows. Row 1 = page title (left) + notifications (right).
     Row 2 = back button (left) + search (middle, when the page sets one) + breadcrumb (right). -->
<c-vars title="" search_placeholder="" />
<header class="border-b border-gray-200 bg-white px-6">
  <div class="flex h-14 items-center justify-between">
    <div class="flex items-center gap-3">
      <button class="text-gray-500 md:hidden"><c-atoms.ui.icon name="lucide:menu" /></button>
      <h1 class="text-lg font-semibold text-gray-900">{{ title|default:SITE_NAME }}</h1>
    </div>
    <button class="text-gray-500 hover:text-gray-700" aria-label="Notifications">
      <c-atoms.ui.icon name="lucide:bell" />
    </button>
  </div>

  <div class="flex h-12 items-center gap-4 border-t border-gray-100">
    <div class="shrink-0">
      <button type="button" x-data="{ show: window.history.length > 1 }" x-show="show" x-cloak
        @click="history.back()" aria-label="Go back"
        class="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-sm font-medium text-gray-700 ring-1 ring-inset ring-gray-300 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <c-atoms.ui.icon name="lucide:arrow-left" size="sm" /> Back
      </button>
    </div>

    <div class="flex flex-1 justify-center">
      {% if search_placeholder %}
        <c-atoms.ui.search placeholder="{{ search_placeholder }}" value="{{ request.GET.q }}" />
      {% endif %}
    </div>

    <nav class="hidden shrink-0 items-center gap-1.5 text-xs text-gray-400 sm:flex" aria-label="Breadcrumb">
      {% for crumb in breadcrumbs %}
        <a href="{{ crumb.url }}" class="hover:text-gray-600">{{ crumb.label }}</a>
        <c-atoms.ui.icon name="lucide:chevron-right" size="sm" />
      {% endfor %}
      <span class="font-medium text-gray-600">{{ title|default:SITE_NAME }}</span>
    </nav>
  </div>
</header>
