{% load static %}
<c-vars title="TGC System" />
<!doctype html>
<html lang="en" class="h-full bg-background">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  {# Set the theme before first paint so there's no light→dark flash on load. #}
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="{% static 'src/img/TGC-logo.png' %}">
  <link rel="apple-touch-icon" href="{% static 'src/img/TGC-logo.png' %}">
  <link rel="preload" href="{% static 'fonts/inter-variable.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'vendor/tom-select/tom-select.css' %}">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <script>window.IconifyProviders = { "": { resources: ["/icons"] } };</script>
  <script src="{% static 'js/iconify-icon.min.js' %}"></script>
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/tom-select/tom-select.complete.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  <script src="{% static 'vendor/alpine/alpine.min.js' %}" defer></script>
</head>
<body class="h-full bg-background font-sans text-foreground antialiased">
  {{ slot }}
</body>
</html>
