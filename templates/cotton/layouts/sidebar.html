{% load static %}
<!-- Sidebar: role navigation. Links are placeholders until feature pages exist. -->
<aside class="hidden w-64 shrink-0 flex-col border-r bg-card md:flex">
    <div class="flex h-16 items-center gap-2 border-b px-5">
        <img src="{% static 'src/img/TGC-logo.png' %}" alt="TGC" class="h-9 w-9 shrink-0 object-contain">
        <span class="text-sm font-semibold text-foreground">TGC System</span>
    </div>
    <nav class="flex-1 space-y-1 p-3 text-sm">
        <c-atoms.ui.nav-item href="{% url 'dashboard:home' %}"
                             icon="lucide:layout-dashboard" label="Dashboard"
                             active_when="dashboard"/>
        <c-atoms.ui.nav-item href="{% url 'orders:index' %}"
                             icon="lucide:package" label="Orders"
                             active_when="orders" perm="orders.view_order"/>
        <c-atoms.ui.nav-item href="{% url 'identification:index' %}"
                             icon="lucide:microscope" label="Identification"
                             active_when="identification" active_names="index,order_identify"
                             perm="identification.add_identificationreport"/>
        <c-atoms.ui.nav-item href="{% url 'identification:findings' %}"
                             icon="lucide:clipboard-list" label="Findings"
                             active_when="identification" active_names="findings,findings_edit,finalize"
                             perm="identification.change_identificationreport"/>
        <c-atoms.ui.nav-item href="{% url 'billing:index' %}" icon="lucide:banknote"
                             label="Billing" active_when="billing" perm="billing.view_bill"/>
        <c-atoms.ui.nav-item href="{% url 'certificates:index' %}" icon="lucide:badge-check"
                             label="Certificates" active_when="certificates" perm="certificates.view_certificate"/>
        <c-atoms.ui.nav-item href="{% url 'users:index' %}" icon="lucide:users" label="Users"
                             active_when="users" perm="accounts.view_user"/>
        <c-atoms.ui.nav-item href="{% url 'backoffice:index' %}" icon="lucide:layout-grid"
                             label="Admin" active_when="backoffice" staff_only="true"/>
    </nav>

    <!-- Account footer: identity + quick actions. The name/role block links to the
         profile page (full details live there); the icon signs out. -->
    <div class="border-t p-3">
        <div class="flex items-center gap-2">
            <a href="#" title="View profile"
               class="flex min-w-0 flex-1 items-center gap-3 rounded-md px-2 py-1.5 transition-colors hover:bg-accent">
                <c-atoms.ui.avatar
                        initials="{{ request.user.get_username|slice:':2'|upper }}"
                        size="sm"/>
                <div class="min-w-0">
                    <p class="truncate text-sm font-medium text-foreground">{{ request.user.get_full_name|default:request.user.get_username }}</p>
                    <p class="truncate text-xs text-muted-foreground">{% if request.user.is_superuser %}Administrator{% else %}{{ request.user.groups.first.name|default:"Member" }}{% endif %}</p>
                </div>
            </a>
            <button type="button" title="Toggle theme" aria-label="Toggle theme" x-data
                    @click="const d = document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', d ? 'dark' : 'light')"
                    class="shrink-0 rounded-md p-2 text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none">
                <span class="hidden dark:inline"><c-atoms.ui.icon name="lucide:sun" size="sm"/></span>
                <span class="inline dark:hidden"><c-atoms.ui.icon name="lucide:moon" size="sm"/></span>
            </button>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" title="Sign out" aria-label="Sign out"
                        class="shrink-0 rounded-md p-2 text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none">
                    <c-atoms.ui.icon name="lucide:log-out" size="sm"/>
                </button>
            </form>
        </div>
    </div>
</aside>
