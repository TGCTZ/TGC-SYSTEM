<!-- Guest layout: centered card for auth pages. -->
<c-vars title="TGC System" />
<c-layouts.base title="{{ title }}">
  <div class="flex min-h-full items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="mb-6 flex items-center justify-center gap-2 text-blue-600">
        <c-atoms.ui.icon name="lucide:gem" size="lg" />
        <span class="text-lg font-semibold text-gray-900">TGC System</span>
      </div>
      <c-atoms.ui.card>{{ slot }}</c-atoms.ui.card>
    </div>
  </div>
</c-layouts.base>
