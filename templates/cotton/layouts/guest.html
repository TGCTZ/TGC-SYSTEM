{% load static %}
<!-- Guest layout: centered card for auth pages. -->
<c-vars title="TGC System" />
<c-layouts.base title="{{ title }}">
  <div class="flex min-h-full items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="mb-6 flex justify-center">
        <img src="{% static 'src/img/TGC-logo.png' %}" alt="Tanzania Gemmological Centre" class="h-24 w-24 object-contain">
      </div>
      <c-atoms.ui.card>{{ slot }}</c-atoms.ui.card>
    </div>
  </div>
</c-layouts.base>
