<!-- App shell: sidebar + header + content + footer. title sets the page title. -->
<c-vars title="TGC System" search_placeholder="" />
<c-layouts.base title="{{ title }}">
  <c-atoms.ui.toaster />
  <div class="flex h-full">
    <c-layouts.sidebar />
    <div class="flex min-w-0 flex-1 flex-col">
      <c-layouts.header title="{{ title }}" search_placeholder="{{ search_placeholder }}" />
      <main class="flex-1 overflow-y-auto bg-muted/30 p-6">{{ slot }}</main>
      <c-layouts.footer />
    </div>
  </div>
</c-layouts.base>
