<!-- Select: searchable combobox by default (Tom Select). search="false" opts out.
     error=bool. Options passed as <option> in the slot. -->
<c-vars error="false" search="true" />
<select
  {% if search != 'false' and search != False %}data-search{% endif %}
  class="block h-9 w-full rounded-md border bg-background px-3 py-1.5 text-sm text-foreground shadow-xs transition-colors focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none
         {% if error == 'true' or error == True %}border-destructive focus-visible:ring-destructive/30{% else %}border-input focus-visible:border-ring{% endif %}"
  {{ attrs }}>{{ slot }}</select>
