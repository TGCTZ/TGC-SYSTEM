<!-- Toggle switch: label (optional), checked (bind with :checked="expr"). -->
<c-vars label="" checked="" />
<label class="relative inline-flex cursor-pointer items-center gap-2">
  <input type="checkbox" class="peer sr-only" {% if checked %}checked{% endif %} {{ attrs }}>
  <span class="relative h-5 w-9 rounded-full bg-gray-300 transition-colors peer-checked:bg-blue-600 peer-disabled:opacity-60
    after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full
    after:bg-white after:transition-transform peer-checked:after:translate-x-4"></span>
  {% if label %}<span class="text-sm text-gray-700">{{ label }}</span>{% endif %}
</label>
