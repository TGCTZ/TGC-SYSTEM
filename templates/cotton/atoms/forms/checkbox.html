<!-- Checkbox: label (optional; else slot) -->
<c-vars label="" />
<label class="inline-flex items-center gap-2 text-sm text-foreground">
  <input type="checkbox"
    class="h-4 w-4 rounded border-input accent-primary focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none" {{ attrs }}>
  {% if label %}{{ label }}{% else %}{{ slot }}{% endif %}
</label>
