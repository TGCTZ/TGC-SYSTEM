<!-- Input: type, error=bool. Pass name/value/placeholder/hx-* via attrs. -->
<c-vars type="text" error="false" />
<input type="{{ type }}"
  class="block w-full rounded-md border-0 px-3 py-1.5 text-sm text-gray-900 shadow-sm
         ring-1 ring-inset placeholder:text-gray-400 focus:ring-2 focus:ring-inset
         {% if error == 'true' or error == True %}ring-red-400 focus:ring-red-500{% else %}ring-gray-300 focus:ring-blue-600{% endif %}"
  {{ attrs }}>
