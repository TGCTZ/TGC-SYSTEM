<!-- Input (shadcn): type, error=bool. Pass name/value/placeholder/hx-* via attrs. -->
<c-vars type="text" error="false" />
<input type="{{ type }}"
  class="flex h-9 w-full min-w-0 rounded-md border bg-transparent px-3 py-1 text-sm text-foreground shadow-xs transition-colors outline-none placeholder:text-muted-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50
         {% if error == 'true' or error == True %}border-destructive focus-visible:ring-destructive/30{% else %}border-input focus-visible:border-ring{% endif %}"
  {{ attrs }}>
