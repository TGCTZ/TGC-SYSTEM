<!-- Spinner: size=sm|md|lg -->
<c-vars size="md" />
<svg class="animate-spin text-current
  {% if size == 'sm' %}h-4 w-4{% elif size == 'lg' %}h-8 w-8{% else %}h-5 w-5{% endif %}"
  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" {{ attrs }}>
  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
  <path class="opacity-75" fill="currentColor"
    d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path>
</svg>
