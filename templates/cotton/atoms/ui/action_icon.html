<!-- One inline row action as an icon button. Pass an action dict from
     apps.core.row_actions: {label, url, icon, method, danger}. -->
<c-vars action />
{% if action.method == "post" %}
  <form method="post" action="{{ action.url }}" class="inline">
    {% csrf_token %}
    <button type="submit" title="{{ action.label }}" aria-label="{{ action.label }}"
      class="inline-flex rounded-md p-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 {% if action.danger %}text-red-600 hover:bg-red-50{% else %}text-gray-500 hover:bg-gray-100{% endif %}">
      <c-atoms.ui.icon name="{{ action.icon }}" size="sm" />
    </button>
  </form>
{% else %}
  <a href="{{ action.url }}" title="{{ action.label }}" aria-label="{{ action.label }}"
    class="inline-flex rounded-md p-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 {% if action.danger %}text-red-600 hover:bg-red-50{% else %}text-gray-500 hover:bg-gray-100{% endif %}">
    <c-atoms.ui.icon name="{{ action.icon }}" size="sm" />
  </a>
{% endif %}
