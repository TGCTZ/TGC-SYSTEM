<!-- Avatar: initials (fallback), src (optional image), size=sm|md|lg -->
<c-vars initials="?" src="" size="md" />
<span class="inline-flex items-center justify-center overflow-hidden rounded-full bg-primary/10 font-medium text-primary
  {% if size == 'sm' %}h-8 w-8 text-xs{% elif size == 'lg' %}h-12 w-12 text-base{% else %}h-10 w-10 text-sm{% endif %}"
  {{ attrs }}>
  {% if src %}<img src="{{ src }}" alt="" class="h-full w-full object-cover">{% else %}{{ initials }}{% endif %}
</span>
