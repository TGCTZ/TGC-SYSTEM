<!-- Card: title (optional), named slots: header, footer; default slot = body -->
<c-vars title="" />
<div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm" {{ attrs }}>
  {% if title or header %}
    <div class="border-b border-gray-200 px-5 py-3">
      {% if header %}{{ header }}{% else %}<h3 class="text-sm font-semibold text-gray-900">{{ title }}</h3>{% endif %}
    </div>
  {% endif %}
  <div class="px-5 py-4">{{ slot }}</div>
  {% if footer %}
    <div class="border-t border-gray-200 bg-gray-50 px-5 py-3">{{ footer }}</div>
  {% endif %}
</div>
