<!-- Search box: a GET form that filters the current list by ?q. Pass placeholder and
     value (the current query). Submits to the current URL on Enter. -->
<c-vars placeholder="Search…" value="" />
<form method="get" role="search" class="relative w-full max-w-lg">
  <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
    <c-atoms.ui.icon name="lucide:search" size="sm" />
  </span>
  <input type="search" name="q" value="{{ value }}" placeholder="{{ placeholder }}"
    class="block w-full rounded-md border-0 bg-gray-50 py-1.5 pl-9 pr-9 text-sm text-gray-900 ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-blue-600"
    {{ attrs }}>
  {% if value %}
    <a href="?" aria-label="Clear search"
      class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
      <c-atoms.ui.icon name="lucide:x" size="sm" />
    </a>
  {% endif %}
</form>
