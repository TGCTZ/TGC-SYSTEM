<!-- Tooltip (CSS hover): text. Wraps the trigger in the slot. -->
<c-vars text="" />
<span class="group relative inline-flex">
  {{ slot }}
  <span class="pointer-events-none absolute -top-8 left-1/2 z-10 -translate-x-1/2 whitespace-nowrap
    rounded-md bg-foreground px-2 py-1 text-xs text-background opacity-0 shadow-md transition group-hover:opacity-100">
    {{ text }}
  </span>
</span>
