<!-- Modal (Alpine): id, title, named slot: footer.
     Open from anywhere: window.dispatchEvent(new CustomEvent('open-<id>')). -->
<c-vars id="modal" title="" />
<div x-data="{ open: false }"
  x-on:open-{{ id }}.window="open = true"
  x-show="open" x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div x-show="open" x-transition:enter="ease-out duration-150" x-transition:enter-start="opacity-0"
    @click="open = false" class="fixed inset-0 bg-black/40"></div>
  <div x-show="open" @keydown.escape.window="open = false"
    x-transition:enter="ease-out duration-150"
    x-transition:enter-start="opacity-0 translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    class="relative w-full max-w-lg rounded-xl bg-white shadow-xl">
    <div class="flex items-center justify-between border-b border-gray-200 px-5 py-3">
      <h3 class="text-sm font-semibold text-gray-900">{{ title }}</h3>
      <button @click="open = false" class="text-gray-400 hover:text-gray-600">
        <c-atoms.ui.icon name="lucide:x" />
      </button>
    </div>
    <div class="px-5 py-4 text-sm text-gray-700">{{ slot }}</div>
    {% if footer %}
      <div class="flex justify-end gap-2 border-t border-gray-200 bg-gray-50 px-5 py-3">{{ footer }}</div>
    {% endif %}
  </div>
</div>
