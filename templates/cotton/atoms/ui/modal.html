<!-- Modal (shadcn dialog, Alpine): id, title, named slot: footer. Teleported to
     body so it escapes clickable rows, overflow, and transforms in its container
     (a click on the backdrop must never bubble to a surrounding data-href row).
     Open from anywhere: window.dispatchEvent(new CustomEvent('open-<id>')). -->
<c-vars id="modal" title="" />
<div x-data="{ open: false }" x-on:open-{{ id }}.window="open = true">
  <template x-teleport="body">
    <div x-show="open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div x-show="open" x-transition:enter="ease-out duration-150" x-transition:enter-start="opacity-0"
        @click="open = false" class="fixed inset-0 bg-black/50"></div>
      <div x-show="open" @keydown.escape.window="open = false"
        x-transition:enter="ease-out duration-150"
        x-transition:enter-start="opacity-0 translate-y-2 scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        class="relative w-full max-w-lg rounded-lg border bg-background text-foreground shadow-lg">
        <div class="flex items-center justify-between border-b px-5 py-3">
          <h3 class="text-sm font-semibold">{{ title }}</h3>
          <button @click="open = false" class="rounded-sm text-muted-foreground transition-colors hover:text-foreground">
            <c-atoms.ui.icon name="lucide:x" />
          </button>
        </div>
        <div class="px-5 py-4 text-sm text-foreground">{{ slot }}</div>
        {% if footer %}
          <div class="flex justify-end gap-2 border-t bg-muted/40 px-5 py-3">{{ footer }}</div>
        {% endif %}
      </div>
    </div>
  </template>
</div>
