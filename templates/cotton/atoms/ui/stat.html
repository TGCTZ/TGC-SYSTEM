<!-- KPI stat tile: label, value, optional delta and icon. -->
<c-vars label="" value="" delta="" icon="lucide:activity" />
<div class="rounded-xl border bg-card p-4 text-card-foreground shadow-sm">
  <div class="flex items-center justify-between">
    <p class="text-sm text-muted-foreground">{{ label }}</p>
    <span class="text-muted-foreground"><c-atoms.ui.icon name="{{ icon }}" /></span>
  </div>
  <p class="mt-2 text-2xl font-semibold text-foreground">{{ value }}</p>
  {% if delta %}<p class="mt-1 text-xs text-success">+{{ delta }} this week</p>{% endif %}
</div>
