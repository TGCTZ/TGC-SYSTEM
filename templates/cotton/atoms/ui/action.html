<!-- Action: a compact icon button for table row actions. icon="set:name". -->
<c-vars icon="lucide:ellipsis" />
<button type="button"
  class="inline-flex items-center justify-center rounded-md p-1.5 text-gray-500
         hover:bg-gray-100 hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
  {{ attrs }}>
  <c-atoms.ui.icon name="{{ icon }}" size="sm" />
</button>
