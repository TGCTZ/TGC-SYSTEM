<!-- Action: a compact icon button for table row actions. icon="set:name". -->
<c-vars icon="lucide:ellipsis" />
<button type="button"
  class="inline-flex items-center justify-center rounded-md p-1.5 text-muted-foreground transition-colors
         hover:bg-accent hover:text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none"
  {{ attrs }}>
  <c-atoms.ui.icon name="{{ icon }}" size="sm" />
</button>
