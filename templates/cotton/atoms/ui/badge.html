<!-- Badge: variant=default|success|warning|danger|info|primary|status, size=sm|md|lg, dot=bool -->
<c-vars variant="default" size="md" dot="false" />
<span class="inline-flex items-center gap-1.5 font-medium rounded-full
  {% if size == 'sm' %}px-2 py-0.5 text-xs{% elif size == 'lg' %}px-3 py-1 text-sm{% else %}px-2.5 py-0.5 text-xs{% endif %}
  {% if variant == 'success' %}bg-green-100 text-green-800
  {% elif variant == 'warning' %}bg-yellow-100 text-yellow-800
  {% elif variant == 'danger' %}bg-red-100 text-red-800
  {% elif variant == 'info' %}bg-blue-100 text-blue-800
  {% elif variant == 'primary' %}bg-blue-600 text-white
  {% elif variant == 'status' %}bg-transparent text-gray-600
  {% else %}bg-gray-100 text-gray-800{% endif %}"
  {{ attrs }}>
  {% if dot == 'true' or dot == True %}
    <span class="h-1.5 w-1.5 rounded-full
      {% if variant == 'success' %}bg-green-500{% elif variant == 'warning' %}bg-yellow-500
      {% elif variant == 'danger' %}bg-red-500{% elif variant == 'info' %}bg-blue-500
      {% else %}bg-gray-400{% endif %}"></span>
  {% endif %}
  {{ slot }}
</span>
