<!-- Badge: variant=default|success|warning|danger|info|primary|status, size=sm|md|lg, dot=bool -->
<c-vars variant="default" size="md" dot="false" />
<span class="inline-flex w-fit items-center gap-1.5 whitespace-nowrap rounded-full font-medium
  {% if size == 'sm' %}px-2 py-0.5 text-xs{% elif size == 'lg' %}px-3 py-1 text-sm{% else %}px-2.5 py-0.5 text-xs{% endif %}
  {% if variant == 'success' %}bg-success/10 text-success
  {% elif variant == 'warning' %}bg-warning/10 text-warning
  {% elif variant == 'danger' %}bg-destructive/10 text-destructive
  {% elif variant == 'info' %}bg-info/10 text-info
  {% elif variant == 'primary' %}bg-primary text-primary-foreground
  {% elif variant == 'status' %}bg-transparent text-muted-foreground
  {% else %}bg-secondary text-secondary-foreground{% endif %}"
  {{ attrs }}>
  {% if dot == 'true' or dot == True %}
    <span class="h-1.5 w-1.5 rounded-full
      {% if variant == 'success' %}bg-success{% elif variant == 'warning' %}bg-warning
      {% elif variant == 'danger' %}bg-destructive{% elif variant == 'info' %}bg-info
      {% else %}bg-muted-foreground{% endif %}"></span>
  {% endif %}
  {{ slot }}
</span>
