<!-- Button (shadcn). variant=primary(default)|secondary|danger(destructive)|success|outline|ghost|link, size=sm|md|lg|icon -->
<c-vars variant="primary" size="md" type="button" />
<button type="{{ type }}"
  class="inline-flex shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50
         {% if size == 'sm' %}h-8 gap-1.5 px-3{% elif size == 'lg' %}h-10 px-6{% elif size == 'icon' %}size-9{% else %}h-9 px-4 py-2{% endif %}
         {% if variant == 'secondary' %}bg-secondary text-secondary-foreground shadow-xs hover:bg-secondary/80
         {% elif variant == 'danger' or variant == 'destructive' %}bg-destructive text-white shadow-xs hover:bg-destructive/90 focus-visible:ring-destructive/30
         {% elif variant == 'success' %}bg-success text-white shadow-xs hover:bg-success/90
         {% elif variant == 'outline' %}border border-input bg-background shadow-xs hover:bg-accent hover:text-accent-foreground
         {% elif variant == 'ghost' %}hover:bg-accent hover:text-accent-foreground
         {% elif variant == 'link' %}text-primary underline-offset-4 hover:underline
         {% else %}bg-primary text-primary-foreground shadow-xs hover:bg-primary/90{% endif %}"
  {{ attrs }}>
  {{ slot }}
</button>
