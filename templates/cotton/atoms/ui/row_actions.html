<!-- Row actions. Pass actions=[{label, url, icon, method, danger}] (see
     apps.core.row_actions). Up to 3 actions render inline as icons; 4+ shows the
     first 3 inline plus a menu listing every action. The menu is teleported to
     <body> and fixed-positioned so the table's overflow can't clip it. -->
<c-vars actions />
<div class="flex items-center justify-end gap-0.5">
  {% if actions|length <= 3 %}
    {% for action in actions %}
      <c-atoms.ui.action-icon :action="action" />
    {% endfor %}
  {% else %}
    {% for action in actions|slice:":3" %}
      <c-atoms.ui.action-icon :action="action" />
    {% endfor %}
    <div x-data="{ open: false, mx: 0, my: 0,
         place() { const r = $refs.trigger.getBoundingClientRect(); this.mx = r.right; this.my = r.bottom + 4; } }"
      class="inline-block text-left">
      <button x-ref="trigger" type="button" @click.stop="open = !open; if (open) place()"
        title="More actions" aria-label="More actions"
        class="rounded-md p-1.5 text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none">
        <c-atoms.ui.icon name="lucide:ellipsis-vertical" size="sm" />
      </button>
      <template x-teleport="body">
        <div x-show="open" x-cloak
          @click.outside="open = false" @keydown.escape.window="open = false"
          @scroll.window="open = false" @resize.window="open = false"
          x-transition:enter="transition ease-out duration-100"
          x-transition:enter-start="opacity-0 scale-95"
          x-transition:enter-end="opacity-100 scale-100"
          :style="`top: ${my}px; left: ${mx}px`"
          class="fixed z-50 min-w-[11rem] -translate-x-full rounded-md border bg-popover p-1 text-popover-foreground shadow-md">
          {% for action in actions %}
            {% if action.method == "post" %}
              <form method="post" action="{{ action.url }}">
                {% csrf_token %}
                <button type="submit"
                  class="flex w-full items-center gap-2 rounded-sm px-3 py-2 text-left text-sm transition-colors {% if action.danger %}text-destructive hover:bg-destructive/10{% else %}hover:bg-accent hover:text-accent-foreground{% endif %}">
                  <c-atoms.ui.icon name="{{ action.icon }}" size="sm" /> {{ action.label }}
                </button>
              </form>
            {% else %}
              <a href="{{ action.url }}"
                class="flex items-center gap-2 rounded-sm px-3 py-2 text-sm transition-colors {% if action.danger %}text-destructive hover:bg-destructive/10{% else %}hover:bg-accent hover:text-accent-foreground{% endif %}">
                <c-atoms.ui.icon name="{{ action.icon }}" size="sm" /> {{ action.label }}
              </a>
            {% endif %}
          {% endfor %}
        </div>
      </template>
    </div>
  {% endif %}
</div>
