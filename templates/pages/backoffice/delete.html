<c-layouts.app title="Delete {{ panel.verbose_name }}">
  <div class="mx-auto max-w-lg space-y-6">
    <h2 class="text-xl font-semibold text-foreground">Delete {{ panel.verbose_name }}</h2>
    <c-atoms.ui.alert variant="warning" title="Are you sure?">
      This will {% if panel.is_soft_delete %}archive{% else %}permanently delete{% endif %} “{{ object }}”.
    </c-atoms.ui.alert>
    <form method="post" class="flex gap-2">
      {% csrf_token %}
      <c-atoms.ui.button type="submit" variant="danger">Delete</c-atoms.ui.button>
      <a href="{% url 'backoffice:detail' panel.app_label panel.model_name object.pk %}"><c-atoms.ui.button type="button" variant="secondary">Cancel</c-atoms.ui.button></a>
    </form>
  </div>
</c-layouts.app>
