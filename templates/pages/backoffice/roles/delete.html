<c-layouts.app title="Delete role">
  <div class="mx-auto max-w-lg space-y-6">
    <h2 class="text-xl font-semibold text-gray-900">Delete role</h2>
    <c-atoms.ui.alert variant="warning" title="Are you sure?">
      This deletes the role “{{ group.name }}”. Members keep their accounts but lose the permissions this role granted.
    </c-atoms.ui.alert>
    <form method="post" class="flex gap-2">
      {% csrf_token %}
      <c-atoms.ui.button type="submit" variant="danger">Delete</c-atoms.ui.button>
      <a href="{% url 'backoffice:role_detail' group.pk %}"><c-atoms.ui.button type="button" variant="secondary">Cancel</c-atoms.ui.button></a>
    </form>
  </div>
</c-layouts.app>
