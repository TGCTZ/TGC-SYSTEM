<c-layouts.app title="Orders" search_placeholder="Search reference, customer, phone…">
  <div class="space-y-6">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-semibold text-gray-900">Orders</h2>
      <a href="{% url 'orders:create' %}">
        <c-atoms.ui.button variant="primary">
          <c-atoms.ui.icon name="lucide:plus" size="sm" /> New order
        </c-atoms.ui.button>
      </a>
    </div>

    <c-sections.table :headers="['Reference', 'Customer', 'Received', 'Stones']" count="{{ orders|length }}">
      {% for order in orders %}
        <c-sections.table.row href="{% url 'orders:detail' order.pk %}" :actions="order.row_actions">
          <td class="px-6 py-3 font-medium">{{ order.reference_no }}</td>
          <td class="px-6 py-3">{{ order.customer.full_name }}</td>
          <td class="px-6 py-3">{{ order.received_date }}</td>
          <td class="px-6 py-3">{{ order.identified }} / {{ order.stone_count }}</td>
        </c-sections.table.row>
      {% endfor %}
    </c-sections.table>

    <c-atoms.ui.pagination :page_obj="page_obj" />
  </div>
</c-layouts.app>
