<c-layouts.app title="New order">
  <div class="mx-auto max-w-3xl space-y-6">
    <c-atoms.ui.breadcrumb>
      <li><a href="{% url 'orders:index' %}" class="hover:text-gray-700">Orders</a></li>
      <li><c-atoms.ui.icon name="lucide:chevron-right" size="sm" /></li>
      <li class="font-medium text-gray-700">New order</li>
    </c-atoms.ui.breadcrumb>

    <form method="post" action="{% url 'orders:create' %}" class="space-y-8">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <c-atoms.ui.alert variant="danger">{{ form.non_field_errors|join:", " }}</c-atoms.ui.alert>
      {% endif %}

      <c-atoms.ui.card title="Customer">
        <div class="grid gap-4 sm:grid-cols-2">
          <c-atoms.forms.formfield :field="form.first_name" />
          <c-atoms.forms.formfield :field="form.middle_name" />
          <c-atoms.forms.formfield :field="form.last_name" />
          <c-atoms.forms.formfield :field="form.phone" />
          <c-atoms.forms.formfield :field="form.email" />
          <c-atoms.forms.formfield :field="form.region" />
        </div>
      </c-atoms.ui.card>

      <c-atoms.ui.card title="Stones">
        <div class="max-w-xs">
          <c-atoms.forms.formfield :field="form.stone_count" />
        </div>
      </c-atoms.ui.card>

      <div class="flex justify-end gap-2">
        <a href="{% url 'orders:index' %}"><c-atoms.ui.button type="button" variant="secondary">Cancel</c-atoms.ui.button></a>
        <c-atoms.ui.button type="submit" variant="primary">Create order</c-atoms.ui.button>
      </div>
    </form>
  </div>
</c-layouts.app>
