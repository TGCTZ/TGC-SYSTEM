<c-layouts.app title="Identification" search_placeholder="Search reference, customer…">
  <div class="space-y-6">
    <h2 class="text-xl font-semibold text-foreground">Identification worklist</h2>
    <p class="text-sm text-muted-foreground">Orders with stones still to identify.</p>

    <c-sections.table :headers="['Reference', 'Customer', 'Received', 'Identified']"
      count="{{ orders|length }}" empty="Nothing to identify.">
      {% for order in orders %}
        <c-sections.table.row href="{% url 'identification:order_identify' order.pk %}" :actions="order.row_actions">
          <td class="px-6 py-3 font-medium">{{ order.reference_number }}</td>
          <td class="px-6 py-3">{{ order.customer.full_name }}</td>
          <td class="px-6 py-3">{{ order.received_date }}</td>
          <td class="px-6 py-3">
            <div class="w-40"><c-atoms.ui.progress :value="order.registered" :max="order.stone_count" /></div>
          </td>
        </c-sections.table.row>
      {% endfor %}
    </c-sections.table>

    <c-atoms.ui.pagination :page_obj="page_obj" />
  </div>
</c-layouts.app>
