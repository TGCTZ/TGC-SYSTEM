<c-layouts.app title="Edit stone {{ stone.label }} · {{ stone.order.reference_no }}">
  <div class="mx-auto max-w-4xl space-y-6">
    <c-atoms.ui.breadcrumb>
      <li><a href="{% url 'identification:index' %}" class="hover:text-gray-700">Identification</a></li>
      <li><c-atoms.ui.icon name="lucide:chevron-right" size="sm" /></li>
      <li><a href="{% url 'identification:order' stone.order_id %}" class="hover:text-gray-700">{{ stone.order.reference_no }}</a></li>
      <li><c-atoms.ui.icon name="lucide:chevron-right" size="sm" /></li>
      <li class="font-medium text-gray-700">Edit {{ stone.label }}</li>
    </c-atoms.ui.breadcrumb>

    <form method="post" action="{% url 'identification:edit' stone.pk %}" class="space-y-6">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <c-atoms.ui.alert variant="danger">{{ form.non_field_errors|join:", " }}</c-atoms.ui.alert>
      {% endif %}

      <c-atoms.ui.card title="Edit stone {{ stone.label }}">
        {% include "pages/identification/_fields.html" %}
      </c-atoms.ui.card>

      <div class="flex justify-end gap-2">
        <a href="{% url 'identification:order' stone.order_id %}">
          <c-atoms.ui.button type="button" variant="secondary">Cancel</c-atoms.ui.button>
        </a>
        <c-atoms.ui.button type="submit" variant="primary">Save changes</c-atoms.ui.button>
      </div>
    </form>
  </div>
</c-layouts.app>
